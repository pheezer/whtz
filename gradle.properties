org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Opt out of AGP 9's built-in Kotlin AND its new DSL so we can use the classic
# org.jetbrains.kotlin.android plugin + KSP (needed for Room/Hilt), which have mature,
# well-documented Compose/KSP/Hilt support. Both opt-outs are deprecated (removed in AGP 10).
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Machine-specific: AGP requires JDK 17, but the system default JVM here is JDK 25.
# Pin Gradle to the brew-installed openjdk@17 so every ./gradlew run is consistent.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
